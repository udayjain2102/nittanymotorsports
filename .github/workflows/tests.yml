name: design checks and tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run every design check and test (writes mule/REPORT.md)
        working-directory: mule
        env:
          MPLBACKEND: Agg
        run: python report.py
